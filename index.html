<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #4f46e5, #0f766e);
      color: #111827;
    }

    .card {
      width: min(92vw, 420px);
      padding: 32px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #111827;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #6b7280;
      font-size: 15px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: #374151;
      font-weight: 600;
    }

    input {
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #6b7280;
    }

    .row a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
    }

    button {
      margin-top: 6px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    button:hover {
      background: #4338ca;
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }

    .footer a {
      color: #0f766e;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your account</p>

    <form>
      <label>
        Email
        <input type="email" placeholder="you@example.com" required />
      </label>

      <label>
        Password
        <input type="password" placeholder="Enter your password" required />
      </label>

      <div class="row">
        <label style="flex-direction: row; gap: 6px; align-items: center; font-weight: 500;">
          <input type="checkbox" />
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Sign In</button>
    </form>

    <p class="footer">Don't have an account? <a href="#">Create one</a></p>
  </div>
</body>
</html>
